[project]
name = "threat-intel-workbench"
version = "0.1.0"
description = "Offline-first threat intelligence workbench that explains how evidence changes asset-level response decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0 (candidate, not yet confirmed)" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2.0",
  "typer>=0.12,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "tzdata>=2024.1",
]

[project.scripts]
tiw = "tiw.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
